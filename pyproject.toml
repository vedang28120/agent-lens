[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-lens"
version = "1.0.0"
description = "Context engine, AST cartography, and safe sandboxing exoskeleton for AI coding assistants."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Vedang Bhatt", email = "vedang28120@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "ast",
    "code-analysis",
    "static-analysis",
    "developer-tools",
    "llm",
    "code-intelligence",
    "tree-sitter"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = [
    "tree-sitter>=0.21.0",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "rapidfuzz>=3.0.0",
    "networkx>=3.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java"
]

[project.urls]
Homepage = "https://github.com/vedang28120/agent-lens"
Documentation = "https://github.com/vedang28120/agent-lens/blob/main/AGENT_GUIDE.md"
Repository = "https://github.com/vedang28120/agent-lens"
Issues = "https://github.com/vedang28120/agent-lens/issues"

[project.scripts]
agent-lens = "agent_lens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_lens*"]

[tool.setuptools.package-data]
agent_lens = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
